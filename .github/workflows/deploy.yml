name: Deploy sofa to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests y lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            sofa_frontend/package-lock.json
            backend_sofa/package-lock.json

      - name: Instalar backend
        working-directory: backend_sofa
        run: npm ci

      - name: Tests backend
        working-directory: backend_sofa
        run: npm test

      - name: Instalar frontend
        working-directory: sofa_frontend
        run: npm ci

      - name: Lint frontend
        working-directory: sofa_frontend
        run: npm run lint

      - name: Tests frontend
        working-directory: sofa_frontend
        run: npm test

      - name: Build frontend
        working-directory: sofa_frontend
        run: npm run build

      - name: Subir dist del frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: sofa_frontend/dist
          retention-days: 1

  deploy:
    name: Deploy a EC2
    needs: test
    runs-on: ubuntu-latest
    # Evita dos despliegues simultáneos sobre la misma EC2.
    concurrency:
      group: deploy-sofa
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar dist del frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: sofa_frontend/dist

      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: "backend_sofa"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Update remote dist
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script: |
            set -e
            rm -rf ${{ secrets.DEPLOY_PATH }}/backend_sofa/dist
            mkdir -p ${{ secrets.DEPLOY_PATH }}/backend_sofa/dist

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: "sofa_frontend/dist/*"
          strip_components: 2
          target: ${{ secrets.DEPLOY_PATH }}/backend_sofa/dist

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.DEPLOY_PATH }}/backend_sofa
            # 1) Dependencias ANTES de ejecutar cualquier script (en una EC2
            #    limpia node_modules aún no existe y pg no estaría instalado).
            npm ci
            # 2) Migraciones idempotentes (CREATE TABLE IF NOT EXISTS).
            node scripts/crear_tabla_jugadores.js
            node scripts/crear_tablas_incidencias.js
            # 3) Reinicia solo la app "sofa"; no toca otras apps del EC2 ni Postgres.
            NODE_ENV=production pm2 restart sofa --update-env || NODE_ENV=production pm2 start server.js --name sofa --update-env
            pm2 save
